name: agentic-platform
services:
  redpanda:
    image: redpandadata/redpanda:v24.3.18
    command: [redpanda, start, --overprovisioned, --smp, "1", --memory, 1G, --reserve-memory, 0M, --node-id, "0", --check=false, --kafka-addr, 0.0.0.0:9092]
    ports: ["9092:9092"]
  neo4j:
    image: neo4j:5.26-community
    environment: {NEO4J_AUTH: neo4j/local-development-password}
    volumes: [neo4j-data:/data]
    ports: ["7474:7474", "7687:7687"]
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
  postgresql:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: local-development-password
    volumes: [postgresql-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U agents -d agents]
      interval: 3s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.15.4
    environment:
      QDRANT__SERVICE__API_KEY: local-development-qdrant-key
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
  rustfs:
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    command: [/data]
    environment:
      RUSTFS_ACCESS_KEY: local-access-key
      RUSTFS_SECRET_KEY: local-secret-key
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes: [rustfs-data:/data]
    ports: ["9000:9000", "9001:9001"]
  create-bucket:
    image: amazon/aws-cli:2.27.49
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: local-access-key
      AWS_SECRET_ACCESS_KEY: local-secret-key
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: [/bin/sh, -c]
    command: ["until aws --endpoint-url http://rustfs:9000 s3 mb s3://agent-documents 2>/dev/null; do sleep 2; done"]
  registry:
    build: {context: ., dockerfile: images/runtime/Dockerfile}
    depends_on:
      postgresql: {condition: service_healthy}
    environment:
      SERVICE: registry
      PORT: "8001"
      POSTGRES_URL: postgresql://agents:local-development-password@postgresql:5432/agents
    ports: ["8001:8001"]
  supervisor:
    build: {context: ., dockerfile: images/runtime/Dockerfile}
    depends_on:
      postgresql: {condition: service_healthy}
      registry: {condition: service_started}
      redpanda: {condition: service_started}
    environment:
      SERVICE: supervisor
      PORT: "8002"
      REGISTRY_URL: http://registry:8001
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_URL: postgresql://agents:local-development-password@postgresql:5432/agents
      AUTH_DISABLED: "true"
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      LLM_GATEWAY_MODEL: ${LLM_GATEWAY_MODEL:-}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
    ports: ["8002:8002"]
  weather:
    build: {context: ., dockerfile: images/runtime/Dockerfile}
    depends_on: [registry, redpanda, redis]
    environment:
      SERVICE: weather
      PORT: "8100"
      AGENT_ENDPOINT: http://weather:8100
      REGISTRY_URL: http://registry:8001
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
    ports: ["8100:8100"]
  knowledge-api:
    build: {context: ., dockerfile: images/runtime/Dockerfile}
    depends_on: [neo4j, qdrant, redis, redpanda, create-bucket]
    environment: &knowledge-env
      SERVICE: knowledge-api
      PORT: "8200"
      KNOWLEDGE_AGENT_ENDPOINT: http://knowledge-api:8200
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: local-development-password
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      OBJECT_STORE_BUCKET: agent-documents
      AWS_ACCESS_KEY_ID: local-access-key
      AWS_SECRET_ACCESS_KEY: local-secret-key
      AWS_REGION: us-east-1
      AUTH_DISABLED: "true"
      POSTGRES_URL: postgresql://agents:local-development-password@postgresql:5432/agents
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: local-development-qdrant-key
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    ports: ["8200:8200"]
  knowledge-worker:
    profiles: [knowledge]
    build: {context: ., dockerfile: images/runtime/Dockerfile}
    depends_on: [knowledge-api]
    environment:
      <<: *knowledge-env
      SERVICE: knowledge-worker
      PORT: "8201"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:8000}
      OPENAI_MODEL: ${OPENAI_MODEL:-/models/model}

volumes:
  neo4j-data: {}
  redis-data: {}
  postgresql-data: {}
  qdrant-data: {}
  rustfs-data: {}
