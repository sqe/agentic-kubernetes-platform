[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-kubernetes-platform"
version = "0.1.0"
description = "Portable Kubernetes runtime for agents and GPU model workloads"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "aiokafka>=0.12,<1",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "neo4j>=5.28,<7",
  "prometheus-client>=0.21,<1",
  "pillow>=11,<13",
  "pypdfium2>=4.30,<6",
  "pypdf>=6,<7",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-snappy>=0.7,<1",
  "python-multipart>=0.0.20,<1",
  "redis[hiredis]>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
mlflow = ["mlflow-skinny>=2.20,<4"]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/platform_runtime",
  "agents/analytics/src/analytics_agent",
  "agents/weather/src/weather_agent",
  "agents/knowledge-graph/src/knowledge_graph_agent",
  "agents/vision/src/vision_agent",
  "services/registry/src/registry_service",
  "services/supervisor/src/supervisor_service",
]

[tool.pytest.ini_options]
addopts = "--cov=platform_runtime --cov=analytics_agent --cov=weather_agent --cov=knowledge_graph_agent --cov=registry_service --cov=supervisor_service --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
