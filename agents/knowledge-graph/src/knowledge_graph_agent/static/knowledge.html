<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Interactive 2D and 3D knowledge graph explorer">
  <title>Knowledge Graph Explorer</title>
  <link rel="icon" href="data:,">
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.79.0/dist/3d-force-graph.min.js"></script>
  <style>
    :root { color-scheme: dark; font: 15px system-ui; background: #070b16; color: #e8eefc; }
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
    aside { padding: 20px; border-right: 1px solid #26334f; overflow: auto; background: #0c1324; }
    h1 { margin-top: 0; font-size: 20px; }
    label { display: block; margin: 14px 0 5px; color: #9fb0d0; }
    input, textarea, select, button { width: 100%; padding: 9px; border-radius: 6px; border: 1px solid #344564; background: #101a30; color: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    button { margin-top: 8px; cursor: pointer; background: #3157d5; border: 0; font-weight: 650; }
    button:hover { background: #4269e8; transform: translateY(-1px); }
    button:disabled { opacity: .55; cursor: wait; }
    .row { display: flex; gap: 8px; }
    .row button { width: auto; flex: 1; }
    .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin: 12px 0; }
    .metric { padding: 9px; border: 1px solid #26334f; border-radius: 7px; background: #101a30; }
    .metric strong { display: block; color: #8fb0ff; font-size: 18px; }
    .metric span { color: #9fb0d0; font-size: 11px; }
    #documents { min-height: 90px; }
    #documents option { padding: 5px; }
    #status { white-space: pre-wrap; font-size: 12px; color: #9fb0d0; }
    #progressPanel { margin-top: 14px; padding: 12px; border: 1px solid #26334f; border-radius: 8px; background: #101a30; display: none; }
    #progressPanel h3 { margin: 0 0 8px; font-size: 14px; color: #8fb0ff; }
    #progressBar { height: 8px; border-radius: 4px; background: #1a2540; overflow: hidden; margin-bottom: 8px; }
    #progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, #3157d5, #5b8cff); transition: width 0.3s ease; }
    #progressText { font-size: 12px; color: #e8eefc; margin-bottom: 4px; }
    #progressPhase { font-size: 11px; color: #9fb0d0; margin-bottom: 8px; }
    #progressLog { max-height: 160px; overflow-y: auto; font-size: 11px; color: #9fb0d0; border-top: 1px solid #26334f; padding-top: 6px; }
    #progressLog div { padding: 2px 0; border-bottom: 1px solid #1a2540; }
    #progressLog div:last-child { border-bottom: none; }
    #progressLog .ts { color: #5b8cff; margin-right: 6px; }
    #tooltip {
      position: fixed; pointer-events: none; z-index: 1000;
      background: #0c1324; border: 1px solid #26334f; border-radius: 8px;
      padding: 8px; max-width: 280px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: none;
    }
    #tooltip img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 4px; margin-bottom: 6px; }
    #tooltip .caption { font-size: 11px; color: #aebbd1; max-height: 60px; overflow: hidden; }
    #tooltip .label { font-size: 12px; color: #e8eefc; font-weight: 600; margin-bottom: 4px; }
    main { min-width: 0; min-height: 0; position: relative; overflow: hidden; }
    main::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(109, 247, 255, .018) 4px),
        radial-gradient(circle at 50% 50%, transparent 48%, rgba(1, 4, 12, .32) 100%);
      mix-blend-mode: screen;
    }
    #graph {
      width: 100%; height: 100%; min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, #0c1324 0%, #070b16 70%);
      box-shadow: inset 0 0 80px rgba(91, 140, 255, 0.08), inset 0 0 160px rgba(91, 140, 255, 0.04);
    }
    #details { position: fixed; top: 16px; right: 16px; max-width: 320px; max-height: 45vh; overflow: auto; padding: 14px; border: 1px solid #344564; border-radius: 8px; background: #0c1324ee; white-space: pre-wrap; font-size: 12px; display: none; z-index: 10; }
    #details {
      box-shadow: 0 0 24px rgba(255, 32, 32, 0.28), inset 0 0 24px rgba(255, 32, 32, 0.07), 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 50, 50, 0.62);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #details::after { content: ''; position: sticky; display: block; inset: 0; height: 1px; margin-top: -1px; background: #ff303088; box-shadow: 0 0 8px #ff2020; animation: hudScan 2.8s linear infinite; pointer-events: none; }
    .details-handle { cursor: move; color: #ff3636; font: 700 10px monospace; letter-spacing: .12em; margin: -4px 0 10px; user-select: none; text-shadow: 0 0 8px #ff2020; }
    .hud-heading { color: #ff4b4b !important; text-transform: uppercase; letter-spacing: .08em; }
    .hud-cursor::after { content: '▋'; color: #ff3434; animation: hudBlink .7s step-end infinite; }
    @keyframes hudBlink { 50% { opacity: 0; } }
    @keyframes hudScan { from { transform: translateY(-40vh); } to { transform: translateY(4vh); } }
  </style>
</head>
<body>
  <div id="tooltip">
    <div class="label"></div>
    <img src="" alt="" />
    <div class="caption"></div>
  </div>
  <aside>
    <h1>Knowledge Graph Explorer</h1>
    <p>Ingest a document in the background, then explore entities and trace relationships.</p>
    <div class="row"><button id="login" onclick="authorize(false)">Log in</button><button id="signup" onclick="authorize(true)">Create account</button></div>
    <button id="logout" onclick="logout()" hidden>Log out</button>
    <p id="identity">Not signed in</p>
    <div id="knowledgeMetrics" class="metrics"></div>
    <label for="title">Document title</label><input id="title" value="Space telescope research">
    <label for="ontology">Ontology</label><select id="ontology"></select>
    <label for="text">Document text</label><textarea id="text" placeholder="Paste extracted document text"></textarea>
    <button onclick="ingest()">Queue ingestion</button>
    <label for="file">Or upload PDF, text, or JSON</label><input id="file" type="file" accept=".pdf,.txt,.json">
    <button id="uploadButton" onclick="upload()">Upload and queue</button>
    <p id="status"></p>
    <div id="progressPanel">
      <h3 id="progressTitle">Ingestion progress</h3>
      <div id="progressBar"><div id="progressFill"></div></div>
      <div id="progressText"></div>
      <div id="progressPhase"></div>
      <div id="progressLog"></div>
    </div>
    <label for="documents">Knowledge sources</label>
    <select id="documents" multiple onchange="browse()"></select>
    <small>Nothing selected shows the complete institutional graph.</small>
    <div class="row"><button onclick="previewDocument()">Preview file</button><button onclick="showVisuals()">Visual evidence</button></div>
    <div class="row"><button onclick="showExtracted()">Extracted data</button><button onclick="showExtractedText()">Extracted text</button></div>
    <label for="query">Entity search</label><input id="query" placeholder="telescope">
    <button onclick="search()">Search graph</button>
    <button onclick="browse()">Browse graph</button>
    <button onclick="semanticSearch()">Fused graph + semantic search</button>
    <label for="typeFilter">Entity type</label><select id="typeFilter" onchange="draw()"><option value="">All types</option></select>
    <label for="viewFilter">Connection view</label>
    <select id="viewFilter" onchange="viewChanged()">
      <option value="atlas" selected>ForceAtlas knowledge map</option>
      <option value="focus">Selected neighborhood</option>
      <option value="buddhabrot">Buddhabrot fractal</option>
      <option value="dragon">Dragon fractal</option>
      <option value="julia">Julia nebula</option>
      <option value="sierpinski">Sierpiński tetrahedron</option>
      <option value="hausdorff">Hausdorff Cantor dust</option>
      <option value="tesseract">4D tesseract fractal</option>
      <option value="life">Conway Life matrix</option>
      <option value="cinema">Fractal cinema</option>
      <option value="all">Complete graph</option>
    </select>
    <label style="display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px;color:#9fb0d0;"><input type="checkbox" id="hideReferences" checked onchange="draw()"> Hide low-value reference nodes</label>
    <label style="display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px;color:#9fb0d0;"><input type="checkbox" id="toggleUnlinked" onchange="showUnlinked=this.checked;draw()"> Show unlinked nodes</label>
    <label style="display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px;color:#9fb0d0;"><input type="checkbox" id="showTargetDetails" checked onchange="toggleTargetDetails()"> Show target details</label>
    <label>Trace shortest path</label>
    <input id="source" placeholder="Source entity"><input id="target" placeholder="Target entity">
    <button onclick="tracePath()">Trace path</button>
    <div class="row"><button onclick="setMode('2d')">2D</button><button onclick="setMode('3d')">3D</button><button onclick="setMode('4d')">4D</button></div>
    <div class="row"><button onclick="startTour()">▶ Graph movie</button><button onclick="pauseTour()">Pause</button></div>
  </aside>
  <main><div id="graph"></div><div id="details"></div></main>
  <script>
    let mode = '2d', current = {nodes: [], edges: []}, renderer, twoDimensionalNodes, ontologyTypes = {}, authConfig, dashboardTimer, stabilizationTimer, tourTimer, fractalTimer, lifeTimer, graphFrame, fourDimensionalFrame, fourDimensionalHalo, fourDimensionalHaloSource = [], graphGeneration = 0, focusedNode = null, tourFocusNode = null, tourIndex = 0, tourSequence = [], cinemaPhase = 0, fractalMode = '', lifeColumns = 0, lifeGeneration = 0, lifeOrder = [], lifeState = new Map();
    const imageUrls = new Map(), hudByNode = new Map(), glowByNode = new Map(), tileByNode = new Map(), glyphByNode = new Map(), voxelTextures = new Map();
    let fractalGuidePoints = [];
    let detailsWriteGeneration = 0, redGlowTexture;
    const token = () => sessionStorage.getItem('id_token') || '';
    const headers = () => token() ? {'Content-Type': 'application/json', Authorization: `Bearer ${token()}`} : {'Content-Type': 'application/json'};
    const status = value => document.querySelector('#status').textContent = value;
    const redirectUri = () => `${location.origin}${location.pathname}`;
    const base64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replaceAll('+', '-').replaceAll('/', '_').replaceAll('=', '');
    function randomValue() { return base64url(crypto.getRandomValues(new Uint8Array(32))); }
    async function authorize(signupRequested) {
      if (!authConfig?.enabled) { status('Authentication is disabled in this local environment.'); return; }
      const verifier = randomValue(), state = randomValue();
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
      sessionStorage.setItem('pkce_verifier', verifier); sessionStorage.setItem('oauth_state', state);
      const endpoint = signupRequested && authConfig.registration_endpoint ? authConfig.registration_endpoint : authConfig.authorization_endpoint;
      const target = new URL(endpoint);
      const values = {client_id: authConfig.client_id, response_type: 'code', redirect_uri: redirectUri(), scope: authConfig.scope, state, code_challenge: base64url(digest), code_challenge_method: 'S256'};
      Object.entries(values).forEach(([key, value]) => target.searchParams.set(key, value));
      if (signupRequested) target.searchParams.set('screen_hint', 'signup');
      location.assign(target);
    }
    async function completeLogin() {
      const params = new URLSearchParams(location.search), code = params.get('code');
      if (!code) return;
      if (params.get('state') !== sessionStorage.getItem('oauth_state')) throw new Error('Invalid login state');
      const body = new URLSearchParams({grant_type: 'authorization_code', client_id: authConfig.client_id, code, redirect_uri: redirectUri(), code_verifier: sessionStorage.getItem('pkce_verifier') || ''});
      const response = await fetch(authConfig.token_endpoint, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body});
      const result = await response.json(); if (!response.ok) throw new Error(result.error_description || 'Login failed');
      sessionStorage.setItem('id_token', result.id_token || result.access_token);
      sessionStorage.setItem('logout_hint', result.id_token || '');
      sessionStorage.removeItem('pkce_verifier'); sessionStorage.removeItem('oauth_state');
      history.replaceState({}, '', location.pathname);
    }
    function showIdentity() {
      const value = token(), enabled = Boolean(authConfig?.enabled);
      const loginButton = document.querySelector('#login'), signupButton = document.querySelector('#signup');
      const logoutButton = document.querySelector('#logout'), identityLabel = document.querySelector('#identity');
      loginButton.hidden = signupButton.hidden = !enabled || Boolean(value); logoutButton.hidden = !enabled || !value;
      if (!value) { identityLabel.textContent = enabled ? 'Not signed in' : 'Local development mode'; return; }
      try { const claims = JSON.parse(atob(value.split('.')[1].replaceAll('-', '+').replaceAll('_', '/'))); identityLabel.textContent = claims.email || claims.preferred_username || claims.sub; }
      catch { identityLabel.textContent = 'Signed in'; }
    }
    function logout() {
      const hint = sessionStorage.getItem('logout_hint'); sessionStorage.clear();
      if (!authConfig.logout_endpoint) { location.reload(); return; }
      const target = new URL(authConfig.logout_endpoint);
      target.searchParams.set('client_id', authConfig.client_id);
      target.searchParams.set('logout_uri', redirectUri());
      target.searchParams.set('post_logout_redirect_uri', redirectUri());
      if (hint) target.searchParams.set('id_token_hint', hint);
      location.assign(target);
    }
    async function request(url, options = {}) {
      const response = await fetch(url, {...options, headers: headers()});
      const body = await responseBody(response);
      if (!response.ok) throw new Error(body.detail || JSON.stringify(body));
      return body;
    }
    async function responseBody(response) {
      const text = await response.text();
      if (!text) return {};
      try { return JSON.parse(text); }
      catch { return {detail: text}; }
    }
    let progressSource = null;
    function connectProgress(taskId) {
      if (progressSource) progressSource.abort();
      const panel = document.querySelector('#progressPanel');
      const fill = document.querySelector('#progressFill');
      const text = document.querySelector('#progressText');
      const phase = document.querySelector('#progressPhase');
      const log = document.querySelector('#progressLog');
      panel.style.display = 'block';
      fill.style.width = '0%';
      text.textContent = 'Starting…';
      phase.textContent = '';
      log.replaceChildren();
      const addLog = (msg) => {
        const div = document.createElement('div');
        const ts = document.createElement('span');
        ts.className = 'ts';
        ts.textContent = new Date().toLocaleTimeString();
        div.appendChild(ts);
        div.appendChild(document.createTextNode(msg));
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
      };
      progressSource = new AbortController();
      const updateProgress = (d) => {
        let pct = 0;
        if (d.phase === 'vision') {
          pct = d.pages_total ? Math.round((d.pages_done / d.pages_total) * 100) : 0;
          text.textContent = d.current;
          phase.textContent = d.latest_event || '';
          if (d.pages_done > 0) addLog(`Page ${d.pages_done}/${d.pages_total}: ${d.latest_event || 'analyzed'}`);
        } else if (d.phase === 'extraction') {
          pct = d.chunks_total ? Math.round((d.chunks_done / d.chunks_total) * 100) : 0;
          text.textContent = d.current;
          phase.textContent = `${d.entities} entities, ${d.relationships} relationships so far`;
          if (d.chunks_done > 0) addLog(`Chunk ${d.chunks_done}/${d.chunks_total}: ${d.latest_event}`);
        } else if (d.phase === 'complete') {
          pct = 100;
          text.textContent = d.current;
          phase.textContent = d.latest_event;
          addLog(`✓ ${d.latest_event}`);
        } else if (d.phase === 'error') {
          text.textContent = d.current;
          phase.textContent = d.latest_event;
          addLog(`✗ ${d.latest_event}`);
        }
        fill.style.width = pct + '%';
      };
      (async () => {
        try {
          const response = await fetch(`/v1/knowledge/progress/${taskId}`, {
            headers: token() ? {Authorization: `Bearer ${token()}`} : {},
            signal: progressSource.signal
          });
          if (!response.ok) throw new Error((await responseBody(response)).detail || 'Progress unavailable');
          addLog('Connected to progress stream');
          const reader = response.body.getReader(), decoder = new TextDecoder();
          let buffer = '';
          while (true) {
            const {value, done} = await reader.read();
            buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
            const events = buffer.split('\n\n'); buffer = events.pop();
            for (const event of events) {
              const data = event.split('\n').find(line => line.startsWith('data: '));
              if (data) updateProgress(JSON.parse(data.slice(6)));
            }
            if (done) break;
          }
        } catch (error) {
          if (error.name !== 'AbortError') addLog(`Progress: ${error.message}`);
        }
      })();
    }
    async function ingest() {
      try {
        const body = {document_id: crypto.randomUUID(), title: document.querySelector('#title').value, text: document.querySelector('#text').value, ontology: document.querySelector('#ontology').value};
        const result = await request('/v1/knowledge/documents', {method: 'POST', body: JSON.stringify(body)});
        status(JSON.stringify(result, null, 2));
        if (result.task_id) connectProgress(result.task_id);
      } catch (error) { status(error.message); }
    }
    async function upload() {
      const input = document.querySelector('#file'), button = document.querySelector('#uploadButton');
      try {
        if (!input.files.length) throw new Error('Choose a PDF, text, or JSON file first.');
        const documentTitle = document.querySelector('#title').value.trim();
        if (!documentTitle) throw new Error('Enter a document title.');
        button.disabled = true; status(`Uploading ${input.files[0].name}…`);
        const form = new FormData(); form.append('title', documentTitle); form.append('ontology', document.querySelector('#ontology').value); form.append('file', input.files[0]);
        const response = await fetch('/v1/knowledge/documents/upload', {
          method: 'POST', headers: token() ? {Authorization: `Bearer ${token()}`} : {}, body: form
        });
        const body = await responseBody(response); if (!response.ok) throw new Error(body.detail || JSON.stringify(body));
        status(JSON.stringify(body, null, 2));
        if (body.task_id) connectProgress(body.task_id);
        input.value = '';
        await loadDashboard();
      } catch (error) { status(error.message); }
      finally { button.disabled = false; }
    }
    async function search() {
      try { current = await request(`/v1/knowledge/search?q=${encodeURIComponent(query.value)}&ontology=${encodeURIComponent(ontology.value)}`); draw(); }
      catch (error) { status(error.message); }
    }
    async function browse() {
      try {
        const params = new URLSearchParams({ontology: document.querySelector('#ontology').value, limit: '500'});
        const type = document.querySelector('#typeFilter').value;
        if (type) params.set('entity_type', type);
        selectedDocuments().forEach(id => params.append('document_id', id));
        current = await request(`/v1/knowledge/graph?${params}`);
        draw();
      } catch (error) { status(error.message); }
    }
    async function semanticSearch() {
      try {
        const params = new URLSearchParams({q: document.querySelector('#query').value, ontology: document.querySelector('#ontology').value});
        selectedDocuments().forEach(id => params.append('document_id', id));
        const result = await request(`/v1/knowledge/fused-search?${params}`);
        current = result.graph; draw();
        status(result.semantic.map(item => `${Number(item.score).toFixed(3)} · ${item.payload.title}\n${item.payload.chunk}`).join('\n\n') || `${current.nodes.length} graph matches`);
      } catch (error) { status(error.message); }
    }
    function selectedDocuments() {
      return [...document.querySelector('#documents').selectedOptions].map(option => option.value);
    }
    async function previewDocument() {
      const id = selectedDocuments()[0]; if (!id) { status('Select one knowledge source first.'); return; }
      try {
        const response = await fetch(`/v1/knowledge/documents/${id}/preview`, {headers: token() ? {Authorization: `Bearer ${token()}`} : {}});
        if (!response.ok) throw new Error((await responseBody(response)).detail || 'Preview failed');
        open(URL.createObjectURL(await response.blob()), '_blank');
      } catch (error) { status(error.message); }
    }
    async function showVisuals() {
      const id = selectedDocuments()[0]; if (!id) { status('Select one knowledge source first.'); return; }
      try {
        const result = await request(`/v1/knowledge/documents/${id}/visuals`);
        status(result.visuals.map(item => `Page ${item.page}\n${item.caption}`).join('\n\n') || 'No visual evidence extracted.');
      } catch (error) { status(error.message); }
    }
    async function showExtracted() {
      const id = selectedDocuments()[0]; if (!id) { status('Select one knowledge source first.'); return; }
      try {
        const result = await request(`/v1/knowledge/documents/${id}/extracted`);
        if (result.graph) {
          const entities = result.graph.entities || [];
          const relationships = result.graph.relationships || [];
          status(`Extracted graph:\n${entities.length} entities, ${relationships.length} relationships\n\n${JSON.stringify(result.graph, null, 2)}`);
        } else {
          status('No extracted graph data available.');
        }
      } catch (error) { status(error.message); }
    }
    async function showExtractedText() {
      const id = selectedDocuments()[0]; if (!id) { status('Select one knowledge source first.'); return; }
      try {
        const result = await request(`/v1/knowledge/documents/${id}/extracted`);
        if (result.text) {
          status(`Extracted text (${result.text.length} chars):\n\n${result.text.slice(0, 5000)}${result.text.length > 5000 ? '\n… (truncated)' : ''}`);
        } else {
          status('No extracted text available.');
        }
      } catch (error) { status(error.message); }
    }
    async function loadDashboard() {
      clearTimeout(dashboardTimer);
      const ontologyId = document.querySelector('#ontology').value;
      if (!ontologyId) return;
      try {
        const [catalog, metrics] = await Promise.all([
          request(`/v1/knowledge/documents?ontology=${encodeURIComponent(ontologyId)}`),
          request(`/v1/knowledge/stats?ontology=${encodeURIComponent(ontologyId)}`)
        ]);
        const selected = new Set(selectedDocuments()), list = document.querySelector('#documents');
        list.replaceChildren(...catalog.documents.map(item => {
          const counts = item.status === 'completed' ? ` · ${item.entity_count || 0} entities` : '';
          const option = new Option(`${item.status.toUpperCase()} · ${item.title}${counts}`, item.id);
          option.selected = selected.has(item.id); return option;
        }));
        const cards = [['Documents', metrics.documents], ['Pictures', metrics.visuals], ['Entities', metrics.entities], ['Relationships', metrics.relationships], ['Vector chunks', metrics.vectors], ['Queued', metrics.queued], ['Processing', metrics.processing]];
        document.querySelector('#knowledgeMetrics').innerHTML = cards.map(([label, value]) => `<div class="metric"><strong>${value || 0}</strong><span>${label}</span></div>`).join('');
        if (metrics.queued || metrics.processing) dashboardTimer = setTimeout(loadDashboard, 4000);
      } catch (error) { status(error.message); }
    }
    async function tracePath() {
      try { current = await request(`/v1/knowledge/path?source=${encodeURIComponent(source.value)}&target=${encodeURIComponent(target.value)}&ontology=${encodeURIComponent(ontology.value)}`); draw(); }
      catch (error) { status(error.message); }
    }
    function setMode(value) { pauseTour(); mode = value; draw(); }
    function viewChanged() {
      if (document.querySelector('#viewFilter').value === 'all') focusedNode = null;
      cinemaPhase = 0;
      draw();
    }
    let showUnlinked = false;
    function deterministicRandom(seed = 0x51f15e) {
      let state = seed >>> 0;
      return () => ((state = (Math.imul(state, 1664525) + 1013904223) >>> 0) / 4294967296);
    }
    function normalizeFractal(points, nodes, depth = 0.32) {

      const names = new Map(current.nodes.map(node => [node.id, node.name]));
      const connections = current.edges.filter(edge => edge.source === value.id || edge.target === value.id).map(edge => {
        const other = edge.source === value.id ? edge.target : edge.source;
        return `${edge.type} → ${names.get(other) || other}${edge.evidence ? `\n  ${edge.evidence}` : ''}`;
      });
      typeHudText(document.querySelector('#entityDescription'), value.description || 'No description.', writeGeneration);
      typeHudText(document.querySelector('#entityMetadata'), Object.keys(metadata).length ? JSON.stringify(metadata, null, 2) : 'No additional properties.', writeGeneration);
      typeHudText(document.querySelector('#entityConnections'), connections.join('\n\n') || 'No visible connections.', writeGeneration);
      loadEntityVisuals(value.name);
    }
    function typeHudText(element, text, generation) {
      let offset = 0;
      element.textContent = '';
      const write = () => {
        if (generation !== detailsWriteGeneration || !element.isConnected) return;
        offset = Math.min(text.length, offset + Math.max(2, Math.ceil(text.length / 180)));
        element.textContent = text.slice(0, offset);
        if (offset < text.length) setTimeout(write, 12);
        else element.classList.remove('hud-cursor');
      };
      write();
    }
    async function loadEntityVisuals(name) {
      const container = document.querySelector('#entityVisuals');
      if (!container) return;
      try {
        const auth = token() ? {Authorization: `Bearer ${token()}`} : {};
        const result = await fetch(`/v1/knowledge/entity/${encodeURIComponent(name)}/visuals?ontology=${encodeURIComponent(ontology.value)}`, {headers: auth});
        if (!result.ok) throw new Error('No pictures found');
        const data = await result.json();
        if (!data.visuals.length) {
          container.innerHTML = '<span style="color:#536887">No pictures extracted for this entity.</span>';
          return;
        }
        container.innerHTML = `<div style="color:#9fb0d0;margin-bottom:8px">📷 ${data.visuals.length} picture${data.visuals.length > 1 ? 's' : ''}:</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">
            ${data.visuals.map(v => `<div style="background:#0c1324;border-radius:8px;overflow:hidden;border:1px solid #1e2a44">
              <img data-image-url="${v.image_url}" style="width:100%;height:120px;object-fit:cover;display:block" loading="lazy" />
              <div style="padding:8px;font-size:11px;color:#aebbd1">
                <div style="color:#9fb0d0;margin-bottom:4px">Page ${v.page}</div>
                <div style="max-height:60px;overflow:hidden">${v.caption.slice(0, 120)}${v.caption.length > 120 ? '…' : ''}</div>
              </div>
            </div>`).join('')}
          </div>`;
        await Promise.all([...container.querySelectorAll('img[data-image-url]')].map(async image => {
          image.src = await authenticatedImageUrl(image.dataset.imageUrl);
        }));
      } catch (error) {
        container.innerHTML = `<span style="color:#536887">No pictures: ${error.message}</span>`;
      }
    }
    async function loadOntologies() {
      try {
        const result = await request('/v1/knowledge/ontologies');
        for (const item of result.ontologies) {
          ontology.add(new Option(`${item.id} (${item.version})`, item.id));
        }
        ontology.value = 'astronomy';
        ontology.addEventListener('change', selectOntology);
        await selectOntology();
      } catch (error) { status(error.message); }
    }
    async function selectOntology() {
      const selected = await request(`/v1/knowledge/ontologies/${encodeURIComponent(ontology.value)}`);
      ontologyTypes = Object.fromEntries(selected.entity_types.map(item => [item.id, item]));
      typeFilter.replaceChildren(new Option('All types', ''));
      selected.entity_types.forEach(item => typeFilter.add(new Option(item.label, item.id)));
      typeFilter.add(new Option('Ontology categories', 'category'));
      await loadDashboard();
      await browse();
    }
    async function initialize() {
      try {
        authConfig = await fetch('/auth/config').then(response => response.json());
        if (authConfig.enabled) await completeLogin();
        showIdentity();
        if (token()) await request('/v1/users/me');
        if (!authConfig.enabled || token()) await loadOntologies();
        else status('Log in or create an account to explore the graph.');
      } catch (error) { status(error.message); }
    }
    function enableMovableDetails() {
      let drag = null;
      details.addEventListener('pointerdown', event => {
        if (!event.target.closest('.details-handle')) return;
        const bounds = details.getBoundingClientRect();
        drag = {x: event.clientX - bounds.left, y: event.clientY - bounds.top};
        details.setPointerCapture(event.pointerId);
      });
      details.addEventListener('pointermove', event => {
        if (!drag) return;
        details.style.right = 'auto';
        details.style.left = `${Math.max(0, Math.min(innerWidth - details.offsetWidth, event.clientX - drag.x))}px`;
        details.style.top = `${Math.max(0, Math.min(innerHeight - 40, event.clientY - drag.y))}px`;
      });
      details.addEventListener('pointerup', event => {
        drag = null;
        if (details.hasPointerCapture(event.pointerId)) details.releasePointerCapture(event.pointerId);
      });
    }
    addEventListener('beforeunload', () => imageUrls.forEach(url => URL.revokeObjectURL(url)));
    enableMovableDetails();
    initialize();
  </script>
</body>
</html>
