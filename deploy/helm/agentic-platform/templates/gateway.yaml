{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  {{- with .Values.gateway.addresses }}
  addresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.infrastructureAnnotations }}
  infrastructure:
    annotations:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  listeners:
    {{- if .Values.gateway.http.enabled }}
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.http.port }}
      allowedRoutes: {namespaces: {from: Same}}
    {{- end }}
    {{- if .Values.gateway.https.enabled }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.https.port }}
      tls:
        mode: Terminate
        certificateRefs:
          {{- toYaml .Values.gateway.https.certificateRefs | nindent 10 }}
      allowedRoutes: {namespaces: {from: Same}}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agentic-platform.fullname" . }}-supervisor
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: {{ ternary "https" "http" .Values.gateway.https.enabled }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /dashboard}
        - path: {type: PathPrefix, value: /share}
        - path: {type: PathPrefix, value: /v1/tasks}
        - path: {type: PathPrefix, value: /v1/route}
        - path: {type: PathPrefix, value: /v1/threads}
        - path: {type: PathPrefix, value: /v1/shared}
        - path: {type: PathPrefix, value: /v1/dashboard}
        - path: {type: PathPrefix, value: /v1/skills}
      backendRefs:
        - name: {{ include "agentic-platform.fullname" . }}-supervisor
          port: {{ .Values.services.supervisor.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agentic-platform.fullname" . }}-knowledge
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: {{ ternary "https" "http" .Values.gateway.https.enabled }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /knowledge}
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs:
        - name: {{ include "agentic-platform.fullname" . }}-knowledge-api
          port: {{ index .Values.services "knowledge-api" "port" }}
    - matches:
        - path: {type: PathPrefix, value: /v1/knowledge}
        - path: {type: PathPrefix, value: /v1/users}
        - path: {type: PathPrefix, value: /mcp}
        - path: {type: PathPrefix, value: /auth}
      backendRefs:
        - name: {{ include "agentic-platform.fullname" . }}-knowledge-api
          port: {{ index .Values.services "knowledge-api" "port" }}
    {{- if .Values.keycloak.enabled }}
    - matches:
        - path: {type: PathPrefix, value: /realms}
        - path: {type: PathPrefix, value: /resources}
      backendRefs:
        - name: {{ include "agentic-platform.fullname" . }}-keycloak{{ ternary "-service" "" (eq .Values.keycloak.mode "operator") }}
          port: 8080
    {{- end }}
{{- end }}
