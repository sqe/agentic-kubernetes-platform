{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: [/bin/sh, -ec]
          args: ["exec redis-server --appendonly yes --aclfile /secrets/users.acl"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {tcpSocket: {port: redis}, initialDelaySeconds: 3}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: credentials, mountPath: /secrets, readOnly: true}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      volumes:
        - name: credentials
          secret: {secretName: {{ .Values.redis.existingSecret }}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.redis.storageClassName }}
        storageClassName: {{ .Values.redis.storageClassName | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.redis.storage }}}}
{{- end }}
