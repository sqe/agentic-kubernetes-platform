image: {repository: agentic-platform-runtime, tag: dev, pullPolicy: IfNotPresent}
kafka: {bootstrapServers: "kafka.messaging.svc:9092", securityProtocol: PLAINTEXT}
services:
  registry: {replicas: 1}
  supervisor:
    replicas: 1
    extraEnv:
      - {name: LLM_GATEWAY_URL, value: "http://host.docker.internal:8081"}
      - {name: LLM_GATEWAY_MODEL, value: "mlx-community/Qwen3.8-27B-4bit"}
      - {name: OBJECT_STORE_ENDPOINT, value: "http://rustfs:9000"}
      - {name: OBJECT_STORE_BUCKET, value: agent-documents}
      - {name: AWS_ACCESS_KEY_ID, value: local-access-key}
      - {name: AWS_SECRET_ACCESS_KEY, value: local-secret-key}
      - {name: AWS_REGION, value: us-east-1}
  weather: {replicas: 1}
  vision:
    replicas: 1
    extraEnv:
      - {name: VISION_AGENT_ENDPOINT, value: "http://platform-agentic-platform-vision:8400"}
      - {name: VISION_BASE_URL, value: "http://host.docker.internal:8082"}
      - {name: VISION_MODEL, value: "mlx-community/Qwen3-VL-4B-Instruct-4bit"}
  knowledge-api:
    replicas: 1
    extraEnv:
      - {name: NEO4J_URI, value: "bolt://neo4j:7687"}
      - {name: OBJECT_STORE_ENDPOINT, value: "http://rustfs:9000"}
      - {name: OBJECT_STORE_BUCKET, value: agent-documents}
      - {name: QDRANT_URL, value: "http://qdrant:6333"}
      - {name: EMBEDDING_MODEL, value: local-hash-v1}
      - name: QDRANT_API_KEY
        valueFrom: {secretKeyRef: {name: platform-qdrant-secret, key: api-key}}
      - name: NEO4J_PASSWORD
        valueFrom: {secretKeyRef: {name: knowledge-secrets, key: neo4j-password}}
  knowledge-worker:
    replicas: 1
    extraEnv:
      - {name: NEO4J_URI, value: "bolt://neo4j:7687"}
      - {name: NEO4J_PASSWORD, valueFrom: {secretKeyRef: {name: knowledge-secrets, key: neo4j-password}}}
      - {name: OBJECT_STORE_ENDPOINT, value: "http://rustfs:9000"}
      - {name: OBJECT_STORE_BUCKET, value: agent-documents}
      - {name: QDRANT_URL, value: "http://qdrant:6333"}
      - {name: EMBEDDING_MODEL, value: local-hash-v1}
      - {name: QDRANT_API_KEY, valueFrom: {secretKeyRef: {name: platform-qdrant-secret, key: api-key}}}
      - {name: OPENAI_BASE_URL, value: "http://host.docker.internal:8081"}
      - {name: OPENAI_MODEL, value: "mlx-community/Qwen3.8-27B-4bit"}
      - {name: VISION_MODEL, value: "mlx-community/Qwen3-VL-4B-Instruct-4bit"}
      - {name: VISION_BASE_URL, value: "http://host.docker.internal:8082"}
      - {name: AWS_ACCESS_KEY_ID, value: local-access-key}
      - {name: AWS_SECRET_ACCESS_KEY, value: local-secret-key}
      - {name: AWS_REGION, value: us-east-1}
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
postgresql: {enabled: true, storage: 2Gi}
qdrant: {enabled: true, storage: 2Gi}
neo4j: {enabled: true, storage: 2Gi}
redis: {enabled: true, storage: 1Gi}
keycloak:
  enabled: true
  mode: operator
  storage: 2Gi
  realmImport: {enabled: true, realm: agentic-platform, clientId: knowledge-graph-ui, publicUrl: "http://127.0.0.1:8080"}
gateway:
  enabled: true
  http: {enabled: true, port: 80}
  https: {enabled: false, port: 443, certificateRefs: []}
monitoring: {serviceMonitor: {enabled: true}}
