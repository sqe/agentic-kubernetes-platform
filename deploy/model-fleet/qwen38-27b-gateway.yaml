apiVersion: fleet.sqe.io/v1alpha1
kind: InferenceService
metadata:
  name: qwen38-27b-router
  namespace: models
spec:
  model:
    name: cyankiwi/Qwen3.8-27B-AWQ-INT4
    version: 63768c10df38c0395e12ef49edac1bd539eaeeea
    uri: hf://cyankiwi/Qwen3.8-27B-AWQ-INT4@63768c10df38c0395e12ef49edac1bd539eaeeea
  container:
    image: vllm/vllm-openai:v0.17.0
    args:
      - --model
      - cyankiwi/Qwen3.8-27B-AWQ-INT4
      - --revision
      - 63768c10df38c0395e12ef49edac1bd539eaeeea
      - --served-model-name
      - qwen38-router
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "2"
      - --gpu-memory-utilization
      - "0.90"
      - --cpu-offload-gb
      - "6"
      - --kv-cache-dtype
      - fp8
      - --enforce-eager
      - --reasoning-parser
      - qwen3
      - --host
      - 0.0.0.0
    port: 8000
    env:
      - name: HF_TOKEN
        valueFrom: {secretKeyRef: {name: huggingface-read-token, key: token}}
    resources:
      requests: {cpu: "8", memory: 32Gi, nvidia.com/gpu: "1"}
      limits: {nvidia.com/gpu: "1"}
  replicas: 1
  accelerator:
    count: 1
    class: gpu-24gb
    fit:
      modules:
        - {name: gpu-resident-weights, memoryGiB: 18, distribution: replicated}
        - {name: kv-cache, memoryGiB: 1, distribution: replicated}
        - {name: runtime, memoryGiB: 1.5, distribution: replicated}
      safetyMarginPercent: 10
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  service: {port: 80}
