apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-platform-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  agentic-platform.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat", "title": "Platform targets up", "id": 1,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(up{namespace=\"agentic-platform\"})", "refId": "A"}],
          "gridPos": {"h": 7, "w": 6, "x": 0, "y": 0}
        },
        {
          "type": "stat", "title": "Cube workloads ready", "id": 2,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(kube_deployment_status_replicas_available{namespace=\"agentic-platform\",deployment=~\"agentic-analytics.*\"})", "refId": "A"}],
          "gridPos": {"h": 7, "w": 6, "x": 6, "y": 0}
        },
        {
          "type": "stat", "title": "Agent deployments ready", "id": 3,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(kube_deployment_status_replicas_available{namespace=\"agentic-platform\",deployment=~\"platform-agentic-platform-(weather|vision|knowledge.*|analytics)\"})", "refId": "A"}],
          "gridPos": {"h": 7, "w": 6, "x": 12, "y": 0}
        },
        {
          "type": "stat", "title": "Kafka consumer lag", "id": 4,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(redpanda_kafka_consumer_group_lag_sum)", "refId": "A"}],
          "gridPos": {"h": 7, "w": 6, "x": 18, "y": 0}
        },
        {
          "type": "timeseries", "title": "Platform CPU", "id": 5,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"agentic-platform\",container!=\"\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A"}],
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 7}
        },
        {
          "type": "timeseries", "title": "Platform memory", "id": 6,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"agentic-platform\",container!=\"\"})", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 7}
        }
      ],
      "refresh": "15s",
      "schemaVersion": 41,
      "tags": ["agentic-platform", "cube", "kubernetes"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "Agentic Platform and Cube",
      "uid": "agentic-platform-cube",
      "version": 1
    }
