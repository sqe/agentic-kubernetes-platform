cubes:
  - name: AgentMessages
    sql: >-
      SELECT m.id, m.thread_id, m.role, m.status, COALESCE(m.skill, 'unassigned') AS skill,
             m.created_at, t.owner
      FROM conversation_messages m
      JOIN conversation_threads t ON t.id = m.thread_id
      WHERE m.role = 'assistant'
    description: Agent task outcomes persisted by the supervisor from Kafka result topics.
    measures:
      - name: count
        type: count
    dimensions:
      - {name: id, sql: id, type: string, primary_key: true}
      - {name: threadId, sql: thread_id, type: string}
      - {name: owner, sql: owner, type: string}
      - {name: skill, sql: skill, type: string}
      - {name: status, sql: status, type: string}
      - {name: createdAt, sql: created_at, type: time}
