<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agentic Platform</title>
  <style>
    :root{font:15px Inter,ui-sans-serif,system-ui;color:#273045;background:#f6f4ff}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#e9e1ff,transparent 34%),radial-gradient(circle at 90% 90%,#dff8ef,transparent 32%),#f9f8fd}
    button,input,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:280px 1fr;max-width:1180px;height:calc(100vh - 32px);margin:16px auto;background:#ffffffcc;border:1px solid #fff;border-radius:24px;box-shadow:0 22px 70px #615c8e25;overflow:hidden;backdrop-filter:blur(18px)}
    aside{padding:22px;background:#312e54;color:#fff;display:flex;flex-direction:column;gap:14px}.brand{font-size:19px;font-weight:800;letter-spacing:-.3px}.brand span{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border-radius:12px;background:#8674ff}.muted{color:#bdb8d8;font-size:12px}.new,.auth button,.share{border:0;border-radius:12px;padding:10px 13px;font-weight:700}.new{background:#8d7cff;color:#fff}.threads{display:flex;flex-direction:column;gap:7px;overflow:auto}.thread{padding:11px;border-radius:12px;color:#ddd9f4;background:transparent;border:0;text-align:left}.thread:hover,.thread.active{background:#ffffff18;color:#fff}.thread small{display:block;color:#a9a2c7;margin-top:4px}.auth{margin-top:auto;display:flex;gap:6px}.auth button{background:#ffffff14;color:#fff;flex:1}
    main{display:flex;flex-direction:column;min-width:0}.top{height:70px;padding:16px 24px;border-bottom:1px solid #ebe9f3;display:flex;align-items:center;gap:12px}.top h1{font-size:18px;margin:0;flex:1}.share{background:#ece9ff;color:#4c447d}.messages{flex:1;overflow:auto;padding:28px max(24px,8vw);display:flex;flex-direction:column;gap:16px}.empty{margin:auto;text-align:center;color:#8a86a0}.empty b{font-size:42px;display:block;margin-bottom:10px}.message{max-width:78%;padding:13px 16px;border-radius:18px;white-space:pre-wrap;line-height:1.5}.user{align-self:flex-end;background:#7566ec;color:#fff;border-bottom-right-radius:5px}.assistant{align-self:flex-start;background:#f0eef8;border-bottom-left-radius:5px}.pending{opacity:.65}.error{color:#a62e4f;background:#ffeaf0}.meta{font-size:11px;opacity:.65;margin-top:7px}.composer{padding:16px 24px 22px;display:flex;gap:10px}.composer select,.composer textarea{border:1px solid #ddd9eb;border-radius:16px;outline:none;background:#fff}.composer select{max-width:190px;padding:0 12px;color:#4c447d}.composer textarea{flex:1;resize:none;min-height:48px;max-height:130px;padding:13px 16px}.composer select:focus,.composer textarea:focus{border-color:#8d7cff;box-shadow:0 0 0 3px #8d7cff18}.send{width:52px;border:0;border-radius:16px;background:#312e54;color:#fff;font-size:20px}.send:disabled{opacity:.5;cursor:wait}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#27243f;color:#fff;padding:10px 16px;border-radius:12px;display:none}@media(max-width:700px){.shell{height:100vh;margin:0;border-radius:0;grid-template-columns:1fr}aside{display:none}.messages{padding:20px}.message{max-width:90%}.composer{flex-wrap:wrap}.composer select{max-width:none;width:100%;height:42px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside><div class="brand"><span>✦</span>Agentic</div><div class="muted">Kafka-powered specialist agents</div><button class="new" onclick="newThread()">＋ New conversation</button><div class="threads" id="threads"></div><div class="auth"><button id="login" onclick="authorize(false)">Log in</button><button id="signup" onclick="authorize(true)">Sign up</button><button id="logout" onclick="signout()" hidden>Log out</button></div></aside>
    <main><header class="top"><h1 id="title">Welcome</h1><button class="share" id="share" onclick="shareThread()" hidden>Share</button></header><section class="messages" id="messages"><div class="empty"><b>✦</b>Start a conversation with your agent team.</div></section><form class="composer" id="composer"><select id="skill" aria-label="Agent skill"><option value="">Loading agents…</option></select><textarea id="prompt" required placeholder="Ask the platform…"></textarea><button class="send" id="send" type="submit" title="Send">↑</button></form></main>
  </div><div class="toast" id="toast"></div>
  <script>
    let current=null,authConfig={},timer;const byId=id=>document.getElementById(id),ui={composer:byId('composer'),login:byId('login'),logout:byId('logout'),messages:byId('messages'),prompt:byId('prompt'),send:byId('send'),share:byId('share'),signup:byId('signup'),skill:byId('skill'),threads:byId('threads'),title:byId('title'),toast:byId('toast')};const token=()=>sessionStorage.getItem('id_token')||'';
    const headers=()=>token()?{'Content-Type':'application/json',Authorization:`Bearer ${token()}`}:{'Content-Type':'application/json'};
    const redirectUri=()=>`${location.origin}${location.pathname}`;const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');const random=()=>b64(crypto.getRandomValues(new Uint8Array(32)));
    async function api(url,options={}){const response=await fetch(url,{...options,headers:{...headers(),...options.headers}});const body=response.status===204?{}:await response.json();if(!response.ok)throw Error(body.detail||'Request failed');return body}
    function notice(text){ui.toast.textContent=text;ui.toast.style.display='block';setTimeout(()=>ui.toast.style.display='none',2600)}
    async function authorize(signupRequested){const verifier=random(),state=random(),digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));sessionStorage.setItem('pkce_verifier',verifier);sessionStorage.setItem('oauth_state',state);const endpoint=signupRequested&&authConfig.registration_endpoint?authConfig.registration_endpoint:authConfig.authorization_endpoint,target=new URL(endpoint);Object.entries({client_id:authConfig.client_id,response_type:'code',redirect_uri:redirectUri(),scope:authConfig.scope,state,code_challenge:b64(digest),code_challenge_method:'S256'}).forEach(([k,v])=>target.searchParams.set(k,v));if(signupRequested)target.searchParams.set('screen_hint','signup');location.assign(target)}
    async function completeLogin(){const params=new URLSearchParams(location.search),code=params.get('code');if(!code)return;if(params.get('state')!==sessionStorage.getItem('oauth_state'))throw Error('Invalid login state');const body=new URLSearchParams({grant_type:'authorization_code',client_id:authConfig.client_id,code,redirect_uri:redirectUri(),code_verifier:sessionStorage.getItem('pkce_verifier')||''}),response=await fetch(authConfig.token_endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),result=await response.json();if(!response.ok)throw Error(result.error_description||'Login failed');sessionStorage.setItem('id_token',result.id_token||result.access_token);sessionStorage.setItem('logout_hint',result.id_token||'');history.replaceState({},'',location.pathname)}
    function signout(){sessionStorage.clear();location.reload()}function authButtons(){ui.login.hidden=ui.signup.hidden=Boolean(token())||!authConfig.enabled;ui.logout.hidden=!token()}
    async function loadSkills(){const items=await api('/v1/skills'),options=items.map(item=>{const option=document.createElement('option');option.value=option.textContent=item.skill;option.title=item.description;return option});if(authConfig.automatic_routing){const auto=document.createElement('option');auto.value='';auto.textContent='Auto · LLM router';options.push(auto)}ui.skill.replaceChildren(...options);if(items.some(item=>item.skill==='weather.current'))ui.skill.value='weather.current';if(!items.length&&!authConfig.automatic_routing){ui.skill.innerHTML='<option value="">No agents available</option>';ui.send.disabled=true}}
    async function loadThreads(){const items=await api('/v1/threads');ui.threads.innerHTML=items.map(t=>`<button class="thread ${t.id===current?'active':''}" onclick="openThread('${t.id}')">${escapeHtml(t.title)}<small>${t.message_count} messages</small></button>`).join('');if(!current&&items[0])await openThread(items[0].id)}
    async function newThread(){const name=window.prompt('Conversation name','New conversation');if(name===null)return;const item=await api('/v1/threads',{method:'POST',body:JSON.stringify({title:name})});current=item.id;await loadThreads();await openThread(item.id)}
    async function openThread(id){current=id;const item=await api(`/v1/threads/${id}`);ui.title.textContent=item.title;ui.share.hidden=false;render(item.messages);await loadThreadListOnly()}
    async function loadThreadListOnly(){const items=await api('/v1/threads');ui.threads.innerHTML=items.map(t=>`<button class="thread ${t.id===current?'active':''}" onclick="openThread('${t.id}')">${escapeHtml(t.title)}<small>${t.message_count} messages</small></button>`).join('')}
    function render(items){ui.messages.innerHTML=items.length?items.map(m=>`<article class="message ${m.role} ${m.status}">${escapeHtml(m.content)}<div class="meta">${escapeHtml(m.skill||m.status)}</div></article>`).join(''):'<div class="empty"><b>✦</b>Ask weather, knowledge, or any registered specialist.</div>';ui.messages.scrollTop=ui.messages.scrollHeight}
    ui.composer.addEventListener('submit',async event=>{event.preventDefault();const value=ui.prompt.value.trim(),skill=ui.skill.value;if(!value)return;ui.send.disabled=true;try{if(!current)await newThread();if(!current)return;await api(`/v1/threads/${current}/messages`,{method:'POST',body:JSON.stringify({prompt:value,...skill&&{skill}})});ui.prompt.value='';await refresh()}catch(error){notice(error.message)}finally{ui.send.disabled=false}});
    async function refresh(){if(!current)return;const item=await api(`/v1/threads/${current}`);render(item.messages)}
    async function shareThread(){const value=await api(`/v1/threads/${current}/share`,{method:'POST'});await navigator.clipboard.writeText(value.url);notice('Read-only link copied ✨')}
    function escapeHtml(value){const node=document.createElement('div');node.textContent=value??'';return node.innerHTML}
    async function shared(){const token=location.pathname.split('/share/')[1];if(!token)return false;document.querySelector('aside').style.display='none';document.querySelector('.shell').style.gridTemplateColumns='1fr';ui.composer.hidden=true;ui.share.hidden=true;const item=await api(`/v1/shared/${token}`);ui.title.textContent=`Shared · ${item.title}`;render(item.messages);return true}
    async function init(){try{if(await shared())return;authConfig=await api('/v1/dashboard/auth');await completeLogin();authButtons();await Promise.all([loadSkills(),loadThreads()]);timer=setInterval(refresh,2000)}catch(error){notice(error.message)}}init();
  </script>
</body>
</html>
